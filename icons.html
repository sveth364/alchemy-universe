<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Иконки — Алхимия Вселенной</title>
<style>
  body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; color: #eef0ff;
         background: radial-gradient(ellipse at 30% 20%, #1b1446, #0b1026 70%); min-height: 100vh; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: #9aa0c8; font-size: 13px; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 12px; text-align: center; }
  .row { display: flex; justify-content: center; align-items: center; gap: 14px; }
  .tile { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center;
          background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); font-size: 32px; }
  .big { width: 96px; height: 96px; margin: 0 auto 8px; }
  .svg-ico { width: 46px; height: 46px; filter: drop-shadow(0 0 4px currentColor); }
  .big .svg-ico { width: 96px; height: 96px; filter: drop-shadow(0 0 6px currentColor); }
  .name { margin-top: 8px; font-size: 13px; }
  .old { font-size: 11px; color: #9aa0c8; }
</style>
</head>
<body>
<h1>Иконки элементов</h1>
<p>Крупно — новая иконка; ниже слева — как в игре, справа — старый эмодзи.</p>
<div class="grid" id="grid"></div>
<script src="elements.js"></script>
<script src="icons.js"></script>
<script>
const names = Object.fromEntries(ELEMENTS.map(e => [e[0], e]));
document.getElementById('grid').innerHTML = Object.keys(ICONS).map(id => {
  const [, name, emoji] = names[id] || [id, id, ''];
  return `<div class="card"><div class="big">${iconHtml(id, emoji)}</div>
    <div class="row"><div class="tile">${iconHtml(id, emoji)}</div><div class="tile">${emoji}</div></div>
    <div class="name">${name}</div></div>`;
}).join('');
</script>
</body>
</html>
