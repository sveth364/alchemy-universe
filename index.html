<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Алхимия Вселенной</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg1: #0b1026; --bg2: #1b1446;
    --panel: rgba(20, 22, 48, .94);
    --text: #eef0ff; --muted: #9aa0c8;
    --accent: #8b7bff; --danger: #ff5c7a; --gold: #ffd166;
    --tile: rgba(255,255,255,.07); --tile-border: rgba(255,255,255,.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at 30% 20%, var(--bg2), var(--bg1) 70%);
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); font-size: 15px;
  }
  header .title { font-weight: 700; letter-spacing: .3px; display: flex; align-items: center; gap: 6px;
    background: none; border: 0; color: var(--text); font: inherit; font-weight: 700; padding: 0; cursor: pointer; }
  header .title .caret { color: var(--muted); font-size: 12px; }
  header .title, #counter { white-space: nowrap; }
  /* на узких экранах вместо «Алхимия · Космос» — колба и «Космос» */
  @media (max-width: 420px) { header .brand { display: none; } }
  /* исчерпанные элементы: все их рецепты уже найдены */
  .el.done .ico, .cell.done .ico { opacity: .45; filter: saturate(.4); }
  .el.done .name, .cell.done .name { opacity: .6; }
  /* выбор режима */
  .modes { display: grid; gap: 10px; margin-top: 10px; text-align: left; }
  .mode-card { display: grid; grid-template-columns: 52px 1fr; gap: 2px 12px; align-items: center; width: 100%;
    padding: 12px; border-radius: 16px; border: 1px solid var(--tile-border); background: var(--tile); color: var(--text);
    font: inherit; cursor: pointer; text-align: left; }
  .mode-card.on { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(139,123,255,.35); }
  .mode-card .svg-ico { width: 52px; height: 52px; grid-row: span 4; }
  .mode-card b { font-size: 16px; }
  .mode-card small { color: var(--gold); font-size: 12px; }
  .mode-card span { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
  .mode-card em { font-style: normal; font-size: 12px; color: var(--muted); }
  #counter {
    display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px 0 7px; border-radius: 99px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--tile-border); color: var(--muted); font: inherit; font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  #counter .svg-ico.ui { width: 16px; height: 16px; filter: none; }
  /* статистика */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 2px; text-align: left; }
  .stat { background: var(--tile); border: 1px solid var(--tile-border); border-radius: 12px; padding: 9px 11px; }
  .stat b { display: block; color: var(--text); font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat b small { color: var(--muted); font-size: 12px; font-weight: 400; }
  .stat span { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.25; margin-top: 2px; }
  .stat.wide { grid-column: 1 / -1; }
  .stats-note { display: block; color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  #progress { height: 3px; background: rgba(255,255,255,.08); margin: 0 16px; border-radius: 2px; overflow: hidden; }
  #progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #ff8bd1); transition: width .4s; }

  /* поле поверх шапки и кнопок: перетаскиваемый элемент не прячется за панелью */
  #board { position: relative; flex: 1; z-index: 5; }
  header, #progress, footer { position: relative; z-index: 1; }
  #board::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff, transparent),
      radial-gradient(1px 1px at 72% 34%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 40% 80%, #fff, transparent),
      radial-gradient(1px 1px at 88% 72%, #fff, transparent),
      radial-gradient(1px 1px at 25% 55%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 60% 12%, #fff, transparent);
  }
  #hint {
    position: absolute; left: 0; right: 0; bottom: 14px; text-align: center;
    color: var(--muted); font-size: 13px; pointer-events: none; padding: 0 16px; line-height: 1.4;
  }

  .el {
    position: absolute; width: 76px; display: flex; flex-direction: column; align-items: center;
    cursor: grab; touch-action: none; transition: transform .12s;
  }
  .el .ico {
    width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center;
    font-size: 32px; background: var(--tile); border: 1px solid var(--tile-border);
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  .el .name { margin-top: 4px; font-size: 11.5px; text-align: center; line-height: 1.15; text-shadow: 0 1px 3px #000; }
  .el.dragging { z-index: 1000; cursor: grabbing; transform: scale(1.12); transition: none; }
  .el.target .ico { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,123,255,.45), 0 0 24px rgba(139,123,255,.6); }
  .el.over-trash .ico { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255,92,122,.5); }
  .el.pop { animation: pop .45s ease-out; }
  .el.shake { animation: shake .35s; }
  @keyframes pop { 0% { transform: scale(.2); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { translate: 0; } 25% { translate: -6px; } 75% { translate: 6px; } }

  footer {
    display: flex; background: linear-gradient(rgba(7,10,24,0), #070a18); gap: 8px; padding: 10px 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  footer button {
    flex: 1; min-width: 0; height: 54px; border-radius: 16px; border: 1px solid var(--tile-border);
    background: var(--panel); color: var(--text); font-size: 13px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    cursor: pointer; transition: background .15s, border-color .15s, transform .15s, opacity .15s;
    font-variant-numeric: tabular-nums;
  }
  footer button span.i { font-size: 20px; line-height: 1; }
  footer button:active { transform: scale(.96); }
  #btnTrash.hot { border-color: var(--danger); background: rgba(255,92,122,.25); transform: scale(1.06); }
  #btnHint.ready { border-color: var(--gold); box-shadow: 0 0 14px rgba(255,209,102,.35); }
  #btnHint.wait { opacity: .6; }

  /* ---- список ---- */
  #sheet {
    position: fixed; inset: 0; z-index: 2000; display: none;
    background: rgba(5,6,20,.6); backdrop-filter: blur(4px);
  }
  #sheet.open { display: block; }
  #sheet .box {
    position: absolute; left: 0; right: 0; bottom: 0; height: 86%;
    background: var(--panel); border-radius: 22px 22px 0 0; border-top: 1px solid var(--tile-border);
    display: flex; flex-direction: column; animation: up .22s ease-out;
    padding-bottom: env(safe-area-inset-bottom);
  }
  @keyframes up { from { transform: translateY(40%); opacity: 0; } }
  #sheet .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 8px; }
  #sheet .head b { flex: 1; font-size: 17px; }
  #sheet .head span { color: var(--muted); font-size: 13px; }
  .btn-sm {
    background: var(--tile); border: 1px solid var(--tile-border); color: var(--text);
    border-radius: 10px; padding: 7px 12px; font-size: 14px; cursor: pointer;
  }
  #search {
    margin: 0 16px 8px; padding: 10px 12px; border-radius: 12px; font-size: 15px;
    background: rgba(255,255,255,.06); border: 1px solid var(--tile-border); color: var(--text); outline: none;
    user-select: text; -webkit-user-select: text;
  }
  #search:focus { border-color: var(--accent); }
  #eras {
    display: flex; gap: 6px; padding: 0 16px 8px; overflow-x: auto; touch-action: pan-x;
    scrollbar-width: none; flex-shrink: 0;
  }
  #eras::-webkit-scrollbar { display: none; }
  #eras button {
    flex-shrink: 0; background: transparent; border: 1px solid var(--tile-border); color: var(--muted);
    border-radius: 99px; padding: 6px 11px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  #eras button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #eras button.locked { opacity: .45; }
  #grid { overflow-y: auto; padding: 4px 12px 12px; touch-action: pan-y; flex: 1; }
  .era-title {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 12px 4px 8px; font-weight: 700; font-size: 14px;
  }
  .era-title span { color: var(--muted); font-weight: 400; font-size: 12px; }
  .era-title { align-items: center; }
  .era-right { display: flex; align-items: center; gap: 8px; }
  .to-board {
    padding: 4px 10px; border-radius: 99px; border: 1px solid var(--accent); background: rgba(139,123,255,.14);
    color: var(--text); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .to-board:active { background: var(--accent); }
  .to-board.wide { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin: 6px 0 2px; padding: 9px 12px; font-size: 13px; }
  .era-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px 6px; }
  .era-locked { color: var(--muted); font-size: 13px; padding: 4px 4px 8px; }
  .cell { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .cell .ico {
    width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-size: 29px;
    background: var(--tile); border: 1px solid var(--tile-border);
  }
  .cell .name { margin-top: 4px; font-size: 11px; text-align: center; color: var(--text); line-height: 1.15; }
  .svg-ico { width: 46px; height: 46px; display: block; filter: drop-shadow(0 0 4px currentColor); }
  .cell .svg-ico { width: 42px; height: 42px; }
  .cell.locked .svg-ico { filter: none; }
  .svg-ico.mini, .cell .svg-ico.mini { width: 16px; height: 16px; display: inline-block; vertical-align: -4px; filter: none; }
  .svg-ico.modal-ico { width: 52px; height: 52px; margin: 0 auto; }
  footer button span.i { display: block; }
  .svg-ico.ui { display: block; width: 26px; height: 26px; filter: drop-shadow(0 0 3px currentColor); }
  #btnClose .svg-ico.ui { width: 16px; height: 16px; filter: none; }
  .search-wrap { position: relative; margin: 0 16px 8px; }
  .search-wrap .svg-ico.ui { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; filter: none; pointer-events: none; }
  .search-wrap #search { margin: 0; width: 100%; padding-left: 36px; }
  .svg-ico.win-ico { width: 120px; height: 120px; margin: 0 auto; filter: drop-shadow(0 0 12px currentColor); }
  #eras .svg-ico.mini { vertical-align: -3px; }
  .svg-ico.logo { width: 22px; height: 22px; display: inline-block; vertical-align: -5px; }
  .cell.locked { cursor: default; }
  .cell.locked .ico { background: transparent; border-style: dashed; }
  .cell.locked .ico span { filter: brightness(0) invert(1); opacity: .16; }
  .cell.locked .name { color: var(--muted); }
  .cell .recipe { font-size: 10px; color: var(--muted); margin-top: 1px; text-align: center; }
  .sheet-foot { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 12px; }
  #btnOpen {
    display: flex; gap: 8px; align-items: center; padding: 6px 12px 6px 7px; border-radius: 999px; cursor: pointer;
    background: var(--tile); border: 1px solid var(--tile-border); color: var(--muted); font: inherit; font-size: 13px; transition: all .15s;
  }
  #btnOpen .sw { width: 28px; height: 16px; border-radius: 8px; background: rgba(255,255,255,.12); position: relative; transition: background .15s; }
  #btnOpen .sw::after { content: ''; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: all .15s; }
  #btnOpen.on { color: var(--text); border-color: var(--accent); }
  #btnOpen.on .sw { background: var(--accent); }
  #btnOpen.on .sw::after { left: 14px; background: #fff; }
  #sheet .head span small { display: block; font-size: 11px; text-align: right; }
  .rec.q-rec { opacity: .55; }
  #btnReset { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 14px; }

  /* ---- модальные окна ---- */
  .modal {
    position: fixed; inset: 0; z-index: 3500; display: none; place-items: center; padding: 16px;
    background: rgba(5,6,20,.7); backdrop-filter: blur(3px);
  }
  .modal.open { display: grid; }
  .modal .card {
    width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--tile-border);
    border-radius: 20px; padding: 20px; text-align: center; animation: pop .3s ease-out;
  }
  .modal .big { font-size: 46px; line-height: 1; }
  .modal h3 { margin: 10px 0 6px; font-size: 18px; }
  .modal p { margin: 0 0 16px; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .modal p b { color: var(--text); }
  /* справка */
  .hdr-right { display: flex; align-items: center; gap: 10px; }
  #btnInfo {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--tile-border); background: var(--panel);
    color: var(--text); font-weight: 800; font-size: 16px; cursor: pointer; transition: all .15s;
  }
  #btnSound {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--tile-border); background: var(--panel);
    display: grid; place-items: center; padding: 0; cursor: pointer;
  }
  #btnSound .svg-ico.ui { width: 18px; height: 18px; filter: none; }
  #btnInfo.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 14px rgba(139,123,255,.8); }
  body.info-mode #board .el .ico, body.info-mode .cell:not(.locked) .ico { border-color: var(--accent); }
  .modal .card.info { max-height: 82vh; overflow-y: auto; }
  .modal .card.info p { text-align: left; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; background: var(--tile);
          border: 1px solid var(--tile-border); font-size: 12px; color: var(--text); margin-bottom: 10px; }
  .desc { display: block; color: var(--text); font-size: 14.5px; margin-bottom: 14px; }
  .how { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .rec { padding: 7px 10px; background: var(--tile); border-radius: 10px; margin-bottom: 6px; font-size: 13.5px; color: var(--text); }
  .rec i { color: var(--muted); font-style: normal; margin: 0 4px; }
  .q { color: var(--muted); letter-spacing: 1px; }
  .modal .row { display: flex; gap: 10px; }
  .modal .row button {
    flex: 1; border: 1px solid var(--tile-border); background: var(--tile); color: var(--text);
    border-radius: 12px; padding: 11px; font-size: 15px; cursor: pointer;
  }
  .modal .row button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  #toast {
    position: fixed; top: 64px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--panel); border: 1px solid var(--accent); border-radius: 14px;
    padding: 10px 16px; font-size: 14px; opacity: 0; pointer-events: none; z-index: 3000;
    transition: opacity .25s, transform .25s; max-width: calc(100% - 32px); text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.era { border-color: var(--gold); }

  #win {
    position: fixed; inset: 0; z-index: 4000; display: none; place-items: center; text-align: center;
    background: radial-gradient(circle, rgba(52,38,120,.97), rgba(5,6,20,.98) 75%); padding: 16px;
  }
  #win.open { display: grid; }
  #win .big { font-size: 96px; animation: pop .8s ease-out; }
  #win h2 { margin: 10px 0 6px; }
  #win p { color: var(--muted); margin: 0 0 18px; }
  #win button { background: var(--accent); color: #fff; border: 0; border-radius: 14px; padding: 12px 22px; font-size: 16px; cursor: pointer; }
  #win > div { max-width: 360px; width: 100%; }
  #win .win-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 14px; }
  #win .win-stats div { background: var(--tile); border: 1px solid var(--tile-border); border-radius: 12px; padding: 8px 4px; }
  #win .win-stats b { display: block; font-size: 15px; } #win .win-stats span { color: var(--muted); font-size: 11px; }
  #win .win-unlock { display: block; color: var(--gold); font-size: 13.5px; margin: 0 0 16px; }
  #win .win-btns { display: flex; gap: 10px; justify-content: center; }
  #win .win-btns .ghost { background: var(--tile); border: 1px solid var(--tile-border); color: var(--text); }
  /* ---- награды ---- */
  .awards-title { display: block; margin: 16px 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; text-align: left; }
  .medals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px 4px; }
  .medal { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--text); line-height: 1.1; }
  .medal i {
    width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-style: normal;
    border: 2px solid var(--gold); background: radial-gradient(circle at 35% 30%, rgba(255,209,102,.35), rgba(255,209,102,.05));
    box-shadow: 0 0 10px rgba(255,209,102,.35);
  }
  .medal i .svg-ico { width: 26px; height: 26px; filter: none; }
  .medal.off { color: var(--muted); } .medal.off i { border-color: var(--tile-border); background: transparent; box-shadow: none; }
  .medal.off i .svg-ico { filter: grayscale(1) brightness(.7); opacity: .35; }
  .feats { display: grid; gap: 6px; text-align: left; }
  .feat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--tile); border: 1px solid var(--tile-border); }
  .feat .svg-ico { width: 30px; height: 30px; flex: none; }
  .feat b { display: block; font-size: 13.5px; color: var(--text); } .feat span { display: block; font-size: 11.5px; color: var(--muted); }
  .feat.got { border-color: rgba(255,209,102,.6); }
  .feat.off { border-style: dashed; background: transparent; }
  .feat-ico { width: 30px; height: 30px; flex: none; display: grid; place-items: center; }
  .feat.off .svg-ico { filter: brightness(0) invert(1); opacity: .18; }
  .feat.off b { letter-spacing: 2px; color: var(--muted); }
  .theme-btn .svg-ico.mini { vertical-align: -3px; }
  .themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .theme-btn { border-radius: 12px; border: 2px solid var(--tile-border); padding: 26px 4px 6px; font: inherit; font-size: 11.5px; color: #fff; cursor: pointer; }
  .theme-btn.on { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,.4); }
  .theme-btn.locked { opacity: .45; }
  .era-title span.era-done { color: var(--gold); font-weight: 700; }
  /* темы оформления (открываются наградами) */
  body.theme-nebula { --bg1: #1a0b1e; --bg2: #4a1d44; --accent: #ff7fb5; --panel: rgba(42,18,44,.95); }
  body.theme-aurora { --bg1: #041619; --bg2: #0e3f45; --accent: #2fd6b8; --panel: rgba(10,38,44,.95); }
  body.creator #logo .svg-ico { filter: drop-shadow(0 0 6px #ffd166); }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="title" id="btnMode"><span id="logo"></span><span><span class="brand">Алхимия · </span><span id="modeName"></span></span><span class="caret">▾</span></button>
    <div class="hdr-right"><button id="counter" aria-label="Статистика"><span data-ui="ui_stats"></span><span id="counterText">0 / 0</span></button><button id="btnSound" aria-label="Звук"></button><button id="btnInfo" aria-label="Справка">?</button></div>
  </header>
  <div id="progress"><div></div></div>
  <div id="board"><div id="hint">Перетащи один элемент на другой, чтобы соединить их.<br>Двойной тап по пустому месту — стартовые элементы.<br>«?» вверху — справка об элементе</div></div>
  <footer>
    <button id="btnList"><span class="i" data-ui="ui_list"></span>Список</button>
    <button id="btnHint"><span class="i" data-ui="ui_hint"></span><span id="hintLabel">Подсказка</span></button>
    <button id="btnClear"><span class="i" data-ui="ui_clear"></span>Очистка</button>
    <button id="btnTrash"><span class="i" data-ui="ui_trash"></span>Корзина</button>
  </footer>
</div>

<div id="sheet">
  <div class="box">
    <div class="head"><b>Элементы</b><span id="sheetCount"></span><button class="btn-sm" id="btnClose"><span data-ui="ui_close"></span></button></div>
    <div class="search-wrap"><span data-ui="ui_search"></span><input id="search" type="search" placeholder="Поиск по открытым" autocomplete="off"></div>
    <div id="eras"></div>
    <div id="grid"></div>
    <div class="sheet-foot">
      <button id="btnOpen" aria-pressed="false"><span class="sw"></span>Только открытые</button>

</div>

<script src="icons-life.js?v=36"></script>
<script src="icons-animals.js?v=36"></script>
<script src="icons-human.js?v=36"></script>
<script src="icons-civ.js?v=36"></script>
<script src="icons-tech.js?v=36"></script>
<script src="icons-cosmos.js?v=36"></script>

<script>
/* ============ ДАННЫЕ ============ */
const HINT_COOLDOWN = 5 * 60 * 1000;   // подсказка раз в 5 минут

const byId = {};
const key = pairKey;
ELEMENTS.forEach(([id, name, icon, era], i) => byId[id] = { id, name, icon, era, order: i });
const MODE_SIZE = Object.fromEntries(Object.keys(MODES).map(id => [id, buildMode(id).set.size]));
// данные текущего режима (см. modes.js)
let MODE, M, recipes, producers, STARTERS, GOAL_ID, modeEls;
function useMode(id) {
  MODE = id; M = buildMode(id);
  recipes = M.recipes; producers = M.producers; STARTERS = M.starters; GOAL_ID = M.goal;
  modeEls = ELEMENTS.filter(e => M.set.has(e[0]));
}
useMode('classic');
const eraById = Object.fromEntries(ERAS.map(([id, name, icon]) => [id, { id, name, icon }]));

/* ============ TELEGRAM ============ */
const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.initData);
const cloudOk = inTelegram && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') && !!tg.CloudStorage;
if (tg) {
  try { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes();
        tg.setHeaderColor && tg.setHeaderColor('#0b1026'); tg.setBackgroundColor && tg.setBackgroundColor('#0b1026');
        // нижняя плашка Telegram с именем бота — красим в цвет панели, чтобы она слилась с игрой
        tg.setBottomBarColor && tg.isVersionAtLeast && tg.isVersionAtLeast('7.10') && tg.setBottomBarColor('#070a18'); } catch (e) {}
}
const haptic = (type) => { try { tg && tg.HapticFeedback && (type === 'error' || type === 'success'
  ? tg.HapticFeedback.notificationOccurred(type) : tg.HapticFeedback.impactOccurred(type)); } catch (e) {} };

/* ============ СОХРАНЕНИЕ ============ */
// v3: прогресс отдельно по режимам. Облако Telegram хранит до 4 КБ на ключ — поэтому по ключу на режим.
const SAVE_KEY = 'alchemy_universe_v3', V2 = 'alchemy_universe_v2', V1 = 'alchemy_universe_v1';
const CLOUD = { meta: 'au3_meta', classic: 'au3_classic', cosmos: 'au3_cosmos' };
const progress = Object.fromEntries(Object.keys(MODES).map(id => [id, new Set(MODES[id].starters)]));
let discovered = progress[MODE];
let lastHint = 0, tutDone = false, savedMode = null;
const addIds = (mode, list) => (list || []).forEach(id => byId[id] && progress[mode] && progress[mode].add(id));
/* Найденные рецепты (пары), по режимам. Чтобы влезть в 4 КБ облака, пара кодируется
   4 символами: номер каждого элемента в ELEMENTS в base36. Поэтому новые элементы
   в ELEMENTS добавляем только в конец. */
const found = Object.fromEntries(Object.keys(MODES).map(id => [id, new Set()]));
const EL_INDEX = Object.fromEntries(ELEMENTS.map((e, i) => [e[0], i]));
const encPairs = (set) => [...set].map(k => k.split('+').map(x => EL_INDEX[x].toString(36).padStart(2, '0')).join('')).join('');
function addPairs(mode, str) {
  if (!found[mode] || typeof str !== 'string') return;
  for (const c of str.match(/.{4}/g) || []) {
    const a = ELEMENTS[parseInt(c.slice(0, 2), 36)], b = ELEMENTS[parseInt(c.slice(2), 36)];
    if (a && b) found[mode].add(pairKey(a[0], b[0]));
  }
}
/* Старые сохранения не знают, каким рецептом открыт элемент: берём первый подходящий.
   Так же страхуемся при слиянии с облаком — у каждого открытого элемента есть хоть один рецепт. */
function fillMissingPairs() {
  for (const mode of Object.keys(MODES)) {
    const B = mode === MODE ? M : buildMode(mode), have = new Set();
    for (const k of found[mode]) if (B.recipes[k]) have.add(B.recipes[k]);
    for (const id of progress[mode]) {
      if (have.has(id) || B.starters.includes(id)) continue;
      const p = (B.producers[id] || []).find(([a, b]) => progress[mode].has(a) && progress[mode].has(b));
      if (p) found[mode].add(pairKey(p[0], p[1]));
    }
  }
}
/* Статистика по режимам: s — попыток соединения, ok — удачных, t — время в игре (мс),
   h — взято подсказок, n — новых элементов, открытых с тех пор, как ведётся статистика */
const STAT_KEYS = ['s', 'ok', 't', 'h', 'n'];
const blankStats = () => Object.fromEntries(STAT_KEYS.map(k => [k, 0]));
const stats = Object.fromEntries(Object.keys(MODES).map(id => [id, blankStats()]));
let statsDirty = false, theme = 'night';
function addStats(mode, o) {
  if (!stats[mode] || !o) return;
  for (const k of STAT_KEYS) stats[mode][k] = Math.max(stats[mode][k], +o[k] || 0);
}
function applySave(raw) {
  if (!raw) return;
  const s = JSON.parse(raw);
  if (Array.isArray(s)) { addIds('cosmos', s); return; }                       // v1
  for (const m in s.st || {}) addStats(m, s.st[m]);
  if (s.th) theme = s.th;
  if (s.v === 3) {
    for (const m in s.p || {}) addIds(m, s.p[m]);
    for (const m in s.r || {}) addPairs(m, s.r[m]);
    if (s.m && MODES[s.m]) savedMode = s.m;
  } else { addIds('cosmos', s.d); if ((s.d || []).length > 4) tutDone = true; } // v2: раньше был только «Космос»
  if (s.h) lastHint = Math.max(lastHint, s.h);
  if (s.t) tutDone = true;
}
function load() {
  for (const k of [V1, V2, SAVE_KEY]) try { applySave(localStorage.getItem(k)); } catch (e) {}
  try {
    if (!cloudOk) return;
    tg.CloudStorage.getItems([V2, CLOUD.meta, CLOUD.classic, CLOUD.cosmos, CLOUD.classic + '_r', CLOUD.cosmos + '_r'], (err, v) => {
      if (err || !v) return;
      try { applySave(v[V2]); } catch (e) {}
      try { if (v[CLOUD.meta]) applySave(JSON.stringify({ v: 3, ...JSON.parse(v[CLOUD.meta]) })); } catch (e) {}
      for (const m of ['classic', 'cosmos']) try { if (v[CLOUD[m]]) addIds(m, JSON.parse(v[CLOUD[m]])); } catch (e) {}
      for (const m of ['classic', 'cosmos']) addPairs(m, v[CLOUD[m] + '_r']);
      fillMissingPairs();
      updateCounter(); updateHintBtn(); refreshDone();
    });
  } catch (e) {}
}
function save() {
  const p = Object.fromEntries(Object.keys(progress).map(m => [m, [...progress[m]]]));
  const r = Object.fromEntries(Object.keys(found).map(m => [m, encPairs(found[m])]));
  statsDirty = false;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 3, m: MODE, t: tutDone, h: lastHint, p, r, st: stats, th: theme })); } catch (e) {}
  try {
    if (!cloudOk) return;
    tg.CloudStorage.setItem(CLOUD.meta, JSON.stringify({ m: MODE, t: tutDone, h: lastHint, st: stats, th: theme }));
    tg.CloudStorage.setItem(CLOUD[MODE], JSON.stringify(p[MODE]));
    tg.CloudStorage.setItem(CLOUD[MODE] + '_r', r[MODE]);
  } catch (e) {}
}

/* ============ ОБЩЕЕ UI ============ */
const board = document.getElementById('board');
const hint = document.getElementById('hint');
const trashBtn = document.getElementById('btnTrash');
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(html, cls) {
  toastEl.innerHTML = html; toastEl.className = 'show' + (cls ? ' ' + cls : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.className = '', 2200);
}
function updateCounter() {
  const total = modeEls.length;
  document.getElementById('counterText').textContent = `${discovered.size} / ${total}`;
  document.querySelector('#progress > div').style.width = (discovered.size / total * 100) + '%';
}
const eraOpen = (era) => modeEls.some(e => e[3] === era && discovered.has(e[0]));
const mini = (id) => iconHtml(id, byId[id].icon, 'mini');
const label = (id) => `${mini(id)} ${byId[id].name}`;

/* модальное окно: modal({icon, title, text, buttons:[{text, primary, onClick}]}) */
const modalEl = document.getElementById('modal');
function modal({ icon, title, text, buttons, cls }) {
  document.querySelector('#modal .card').className = 'card' + (cls ? ' ' + cls : '');
  document.getElementById('mIcon').innerHTML = icon || '';
  document.getElementById('mTitle').textContent = title || '';
  document.getElementById('mText').innerHTML = text || '';
  const row = document.getElementById('mButtons'); row.innerHTML = '';
  buttons.forEach(b => {
    const el = document.createElement('button');
    el.textContent = b.text; if (b.primary) el.className = 'primary';
    el.onclick = () => { modalEl.classList.remove('open'); b.onClick && b.onClick(); };
    row.appendChild(el);
  });
  modalEl.classList.add('open');
}

/* ============ ПОЛЕ ============ */
function spawn(id, x, y, anim) {
  const d = byId[id];
  const el = document.createElement('div');
  el.className = 'el' + (anim ? ' pop' : '');
  el.dataset.id = id;
  el.innerHTML = `<div class="ico">${iconHtml(id, d.icon)}</div><div class="name">${d.name}</div>`;
  const r = board.getBoundingClientRect();
  x = Math.max(0, Math.min(r.width - 76, x)); y = Math.max(0, Math.min(r.height - 84, y));
  el.style.left = x + 'px'; el.style.top = y + 'px';
  board.appendChild(el);
  el.addEventListener('pointerdown', startDrag);
  el.addEventListener('animationend', () => el.classList.remove('pop', 'shake'));
  if (isDone(id)) el.classList.add('done');
  hint.style.display = 'none';
  return el;
}

function center(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + 29 }; }
function findTarget(drag) {
  const c = center(drag); let best = null, bd = 50;
  board.querySelectorAll('.el').forEach(o => {
    if (o === drag) return;
    const p = center(o), d = Math.hypot(p.x - c.x, p.y - c.y);
    if (d < bd) { bd = d; best = o; }
  });
  return best;
}
function overTrash(px, py) {
  const r = trashBtn.getBoundingClientRect();
  return px >= r.left - 8 && px <= r.right + 8 && py >= r.top - 20 && py <= r.bottom + 8;
}

let drag = null;
function startDrag(e) {
  const el = e.currentTarget;
  const r = el.getBoundingClientRect();
  drag = { el, dx: e.clientX - r.left, dy: e.clientY - r.top, sx: e.clientX, sy: e.clientY, moved: false, target: null };
  e.preventDefault();
  el.classList.add('dragging'); Sound.play('pick');
  board.appendChild(el);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
}
function onMove(e) {
  if (!drag) return;
  const br = board.getBoundingClientRect();
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 4) drag.moved = true;
  drag.el.style.left = (e.clientX - br.left - drag.dx) + 'px';
  drag.el.style.top = (e.clientY - br.top - drag.dy) + 'px';
  const hot = overTrash(e.clientX, e.clientY);
  const t = hot ? null : findTarget(drag.el);
  if (drag.target && drag.target !== t) drag.target.classList.remove('target');
  if (t) t.classList.add('target');
  drag.target = t;
  trashBtn.classList.toggle('hot', hot);
  drag.el.classList.toggle('over-trash', hot);
}
function endDrag(e) {
  if (!drag) return;
  const { el, target, moved } = drag;
  window.removeEventListener('pointermove', onMove);
  window.removeEventListener('pointerup', endDrag);
  window.removeEventListener('pointercancel', endDrag);
  el.classList.remove('dragging', 'over-trash');
  trashBtn.classList.remove('hot');
  if (target) target.classList.remove('target');
  drag = null;

  if (overTrash(e.clientX, e.clientY)) { el.remove(); haptic('light'); Sound.play('trash'); checkEmpty(); return; }
  if (!moved) { handleTap(el); return; }
  if (target) combine(el, target);
  else {
    const br = board.getBoundingClientRect();
    el.style.left = Math.max(0, Math.min(br.width - 76, parseFloat(el.style.left))) + 'px';
    el.style.top = Math.max(0, Math.min(br.height - 84, parseFloat(el.style.top))) + 'px';
  }
}

/* двойной тап по элементу — копия */
let lastTap = { el: null, t: 0 };
function handleTap(el) {
  if (infoMode) { showInfo(el.dataset.id); return; }
  const now = Date.now();
  if (lastTap.el === el && now - lastTap.t < 350) {
    spawn(el.dataset.id, parseFloat(el.style.left) + 30, parseFloat(el.style.top) + 30, true);
    haptic('light'); Sound.play('pop'); lastTap = { el: null, t: 0 };
  } else lastTap = { el, t: now };
}

/* двойной тап по пустому месту — стартовые элементы */
let lastBoardTap = { t: 0, x: 0, y: 0 };
board.addEventListener('pointerdown', e => {
  if (e.target !== board) return;
  const now = Date.now();
  if (now - lastBoardTap.t < 350 && Math.hypot(e.clientX - lastBoardTap.x, e.clientY - lastBoardTap.y) < 40) {
    const r = board.getBoundingClientRect();
    const x = e.clientX - r.left - 38, y = e.clientY - r.top - 42, o = 48;
    [[-o, -o], [o, -o], [-o, o], [o, o]].forEach(([dx, dy], i) => STARTERS[i] && spawn(STARTERS[i], x + dx, y + dy, true));
    haptic('light'); Sound.play('pop'); lastBoardTap = { t: 0, x: 0, y: 0 };
  } else lastBoardTap = { t: now, x: e.clientX, y: e.clientY };
});

function combine(a, b) {
  const result = recipes[key(a.dataset.id, b.dataset.id)];
  stats[MODE].s++; if (result) stats[MODE].ok++; statsDirty = true;
  if (!result) {
    a.classList.add('shake'); b.classList.add('shake'); haptic('error'); Sound.play('fail');
    a.style.left = (parseFloat(a.style.left) + 40) + 'px';
    return;
  }
  const x = (parseFloat(a.style.left) + parseFloat(b.style.left)) / 2;
  const y = (parseFloat(a.style.top) + parseFloat(b.style.top)) / 2;
  const pk = key(a.dataset.id, b.dataset.id), newPair = !found[MODE].has(pk);
  found[MODE].add(pk);
  a.remove(); b.remove();
  spawn(result, x, y, true);
  if (!discovered.has(result)) discover(result);
  else if (newPair) {
    save(); haptic('success'); Sound.play('recipe');
    toast(`Новый рецепт: <b>${label(result)}</b><br>${mini(a.dataset.id)} + ${mini(b.dataset.id)}`);
  } else { haptic('medium'); Sound.play('combine'); }
}

function discover(id) {
  const era = byId[id].era, newEra = !eraOpen(era);
  discovered.add(id); stats[MODE].n++; save(); updateCounter(); haptic('success');
  Sound.play(id === GOAL_ID ? 'combine' : newEra ? 'era' : 'discover');
  if (newEra) toast(`Открыта эпоха: <b>${eraIcon(era)} ${eraById[era].name}</b><br>${label(id)}`, 'era');
  else toast(`Новый элемент: <b>${label(id)}</b>`);
  refreshDone();
  if (id === GOAL_ID) setTimeout(showWin, 700);
  else checkAwards(era);
}

function checkEmpty() { if (!board.querySelector('.el')) hint.style.display = ''; }

function placeStarters() {
  const r = board.getBoundingClientRect();
  const cx = r.width / 2 - 38, cy = r.height / 2 - 42, off = Math.min(90, r.width / 5);
  [[-off, -off], [off, -off], [-off, off], [off, off]].forEach(([dx, dy], i) => STARTERS[i] && spawn(STARTERS[i], cx + dx, cy + dy, true));
}

/* ============ СПИСОК ============ */
const sheet = document.getElementById('sheet');
const grid = document.getElementById('grid');
const searchEl = document.getElementById('search');
const btnOpen = document.getElementById('btnOpen');
let onlyOpenOn = false;
let eraFilter = 'all';

/* рецепты элемента, которые игрок действительно собирал */
const foundPairs = (id) => (producers[id] || []).filter(([a, b]) => found[MODE].has(key(a, b)));
const foundCount = () => [...found[MODE]].filter(k => recipes[k]).length;
function knownRecipe(id) {
  const r = foundPairs(id)[0];
  return r ? `${mini(r[0])} + ${mini(r[1])}` : '';
}
function cellHtml(id) {
  const d = byId[id], open = discovered.has(id);
  const recipe = open && producers[id] && !STARTERS.includes(id) ? `<div class="recipe">${knownRecipe(id)}</div>` : '';
  return `<div class="cell${open ? '' : ' locked'}${open && isDone(id) ? ' done' : ''}" data-id="${id}"><div class="ico"><span>${iconHtml(id, d.icon)}</span></div>` +
         `<div class="name">${open ? d.name : '???'}</div>${recipe}</div>`;
}
function renderEras() {
  const box = document.getElementById('eras');
  const btn = (id, text, locked) =>
    `<button data-era="${id}" class="${eraFilter === id ? 'on' : ''}${locked ? ' locked' : ''}">${text}</button>`;
  box.innerHTML = btn('all', 'Все') + ERAS.map(([id, name, icon]) => {
    const all = modeEls.filter(e => e[3] === id), got = all.filter(e => discovered.has(e[0])).length;
    if (!all.length) return '';
    return got ? btn(id, `${eraIcon(id)} ${name} ${got}/${all.length}`) : btn(id, `${iconHtml('ui_lock', '🔒', 'mini')} ${name}`, true);
  }).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = () => { eraFilter = b.dataset.era; renderList(); });
}
function renderList() {
  renderEras();
  document.getElementById('sheetCount').innerHTML =
    `${discovered.size} / ${modeEls.length}<small>рецепты ${foundCount()} / ${Object.keys(recipes).length}</small>`;
  const q = searchEl.value.trim().toLowerCase();
  const onlyOpen = onlyOpenOn || q;
  let html = '';
  // открытые эпохи — первыми, закрытые — в конце
  [...ERAS].sort((x, y) => eraOpen(y[0]) - eraOpen(x[0])).forEach(([era, name, icon]) => {
    if (eraFilter !== 'all' && eraFilter !== era) return;
    const all = modeEls.filter(e => e[3] === era).map(e => e[0]);
    if (!all.length) return;
    const got = all.filter(id => discovered.has(id)).length;
    let ids = all;
    if (onlyOpen) ids = ids.filter(id => discovered.has(id));
    if (q) ids = ids.filter(id => byId[id].name.toLowerCase().includes(q));
    if (!got && !q) {
      if (eraFilter === era || !onlyOpen)
        html += `<div class="era-title"><b>${iconHtml('ui_lock', '🔒', 'mini')} ${name}</b><span>0 / ${all.length}</span></div>` +
                `<div class="era-locked">Эпоха откроется, когда найдёшь её первый элемент.</div>`;
      return;
    }
    if (!ids.length) return;
    const n = q ? 0 : Math.min(usefulIds(era).length, boardCap());          // столько, сколько реально встанет на поле
    const toBoard = n ? `<button class="to-board" data-era="${era}">На поле · ${n}</button>` : '';
    html += `<div class="era-title"><b>${eraIcon(era)} ${name}</b><span class="era-right">${toBoard}<span class="${got === all.length ? 'era-done' : ''}">${got === all.length ? '★ ' : ''}${got} / ${all.length}</span></span></div>` +
            `<div class="era-grid">${ids.map(cellHtml).join('')}</div>`;
  });
  // на вкладке «Все» — кнопка выложить все полезные элементы сразу
  const nAll = eraFilter === 'all' && !q ? usefulIds('all').length : 0, cap = boardCap();
  const allBtn = !nAll ? '' : `<button class="to-board wide" data-era="all">${nAll > cap
    ? `Выложить на поле ${cap} самых полезных` : `Выложить на поле всё полезное · ${nAll}`}</button>`;
  grid.innerHTML = html ? allBtn + html : '<div class="empty">Ничего не найдено</div>';
}

/* ============ «НА ПОЛЕ» ============ */
// открытые элементы, из которых ещё можно получить что-то новое; самые «плодовитые» — первыми
function usefulIds(era) {
  return modeEls.filter(e => (era === 'all' || e[3] === era) && discovered.has(e[0]) && !isDone(e[0]))
    .map(e => e[0]).sort((a, b) => newFrom(b).length - newFrom(a).length);
}
const CW = 82, CH = 92;                                    // клетка сетки на поле
const boardGrid = () => { const r = board.getBoundingClientRect();
  return { r, cols: Math.max(1, Math.floor((r.width - 8) / CW)), rows: Math.max(1, Math.floor((r.height - 8) / CH)) }; };
const boardCap = () => { const g = boardGrid(); return g.cols * g.rows; };
function layOut(era) {
  const ids = usefulIds(era);
  if (!ids.length) return;
  const { r, cols, rows } = boardGrid();
  const list = ids.slice(0, cols * rows), usedRows = Math.ceil(list.length / cols);
  const x0 = (r.width - cols * CW) / 2 + (CW - 76) / 2, y0 = Math.max(4, (r.height - usedRows * CH) / 2);
  board.querySelectorAll('.el').forEach(e => e.remove());
  list.forEach((id, i) => setTimeout(() => spawn(id, x0 + (i % cols) * CW, y0 + Math.floor(i / cols) * CH, true), i * 18));
  closeList(); haptic('medium'); Sound.play('pop');
  const where = era === 'all' ? '' : ` из эпохи «${eraById[era].name}»`;
  toast(list.length < ids.length
    ? `На поле ${list.length} самых полезных${where}.<br>Ещё ${ids.length - list.length} можно добавить из списка`
    : `На поле ${list.length}${where}`);
}
grid.addEventListener('click', e => {
  const tb = e.target.closest('.to-board');
  if (tb) { layOut(tb.dataset.era); return; }
  const c = e.target.closest('.cell'); if (!c || c.classList.contains('locked')) return;
  if (infoMode) { showInfo(c.dataset.id); return; }
  const r = board.getBoundingClientRect();
  spawn(c.dataset.id, r.width / 2 - 38 + (Math.random() - .5) * 80, r.height / 2 - 42 + (Math.random() - .5) * 80, true);
  closeList(); haptic('light'); Sound.play('pop');
});
function openList() { searchEl.value = ''; renderList(); sheet.classList.add('open'); grid.scrollTop = 0; }
function closeList() { sheet.classList.remove('open'); searchEl.blur(); }
document.getElementById('btnList').onclick = openList;
document.getElementById('btnClose').onclick = closeList;
sheet.addEventListener('click', e => { if (e.target === sheet) closeList(); });
searchEl.addEventListener('input', renderList);
btnOpen.onclick = () => {
  onlyOpenOn = !onlyOpenOn; btnOpen.classList.toggle('on', onlyOpenOn); btnOpen.setAttribute('aria-pressed', onlyOpenOn);
  renderList(); haptic('light');
};
document.getElementById('btnReset').onclick = () => modal({
  icon: iconHtml('ui_warn', '⚠️', 'modal-ico'), title: 'Сбросить прогресс?', text: `Все открытые элементы в режиме «${M.name}» будут потеряны. Другой режим не пострадает.`,
  buttons: [
    { text: 'Отмена' },
    { text: 'Сбросить', primary: true, onClick: () => {
      progress[MODE] = discovered = new Set(STARTERS); found[MODE].clear(); stats[MODE] = blankStats(); save(); updateCounter(); updateHintBtn();
      board.querySelectorAll('.el').forEach(e => e.remove()); placeStarters(); closeList();
    } },
  ],
});

/* ============ ПОДСКАЗКИ ============ */
const hintBtn = document.getElementById('btnHint');
const hintLabel = document.getElementById('hintLabel');
const hintLeft = () => Math.max(0, lastHint + HINT_COOLDOWN - Date.now());
const fmt = (ms) => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function updateHintBtn() {
  const left = hintLeft();
  hintLabel.textContent = left ? fmt(left) : 'Подсказка';
  hintBtn.classList.toggle('ready', !left);
  hintBtn.classList.toggle('wait', !!left);
}
setInterval(updateHintBtn, 1000);

/* рецепты, которые игрок уже может собрать, но результат ещё не открыт */
function hintCandidates() {
  const out = [];
  for (const [res, list] of Object.entries(producers)) {
    if (discovered.has(res)) continue;
    for (const [a, b] of list) if (discovered.has(a) && discovered.has(b)) out.push({ res, a, b });
  }
  return out;
}
hintBtn.onclick = () => {
  const left = hintLeft();
  if (left) { toast(`Следующая подсказка через <b>${fmt(left)}</b>`); return; }
  modal({
    icon: iconHtml('ui_hint', '💡', 'modal-ico'), title: 'Получить подсказку?',
    text: 'Подскажу один ингредиент для нового элемента.<br>Следующая подсказка будет доступна через 5 минут.',
    buttons: [{ text: 'Не сейчас' }, { text: 'Получить', primary: true, onClick: giveHint }],
  });
};
function giveHint() {
  const list = hintCandidates();
  if (!list.length) {
    modal({ icon: iconHtml('ui_trophy', '🏆', 'modal-ico'), title: 'Подсказок нет', text: 'Ты открыл всё, что можно собрать!', buttons: [{ text: 'Ок', primary: true }] });
    return;
  }
  const h = list[Math.floor(Math.random() * list.length)];
  const [x] = Math.random() < .5 ? [h.a, h.b] : [h.b, h.a];
  lastHint = Date.now(); stats[MODE].h++; save(); updateHintBtn(); Sound.play('hint');
  modal({
    icon: iconHtml(x, byId[x].icon, 'modal-ico'), title: 'Подсказка',
    text: `Возьми <b>${label(x)}</b> и найди ему пару среди открытых элементов.<br>Получится новый элемент из эпохи «${eraById[byId[h.res].era].name}».`,
    buttons: [{ text: 'Понятно', primary: true }],
  });
  haptic('light');
}

/* ============ СПРАВКА «?» ============ */
let infoMode = false;
const infoBtn = document.getElementById('btnInfo');
function setInfoMode(on) {
  infoMode = on; infoBtn.classList.toggle('on', on); document.body.classList.toggle('info-mode', on);
  if (on) toast('Режим справки: нажми на элемент на поле или в списке');
}
infoBtn.onclick = () => { setInfoMode(!infoMode); haptic('light'); };
/* звук вкл/выкл */
const soundBtn = document.getElementById('btnSound');
const drawSoundBtn = () => { soundBtn.innerHTML = iconHtml(Sound.on ? 'ui_sound' : 'ui_mute', Sound.on ? '🔊' : '🔇', 'ui'); };
soundBtn.onclick = () => { const on = Sound.toggle(); drawSoundBtn(); haptic('light'); toast(on ? 'Звук включён' : 'Звук выключен'); };
drawSoundBtn();
function showInfo(id) {
  setInfoMode(false);
  const d = byId[id];
  // ингредиенты, которые ещё не открыты, не раскрываем
  const part = (x) => discovered.has(x) ? `${mini(x)} ${byId[x].name}` : '<span class="q">???</span>';
  // найденные рецепты — целиком, ненайденные — «??? + ???»
  const all = producers[id] || [], got = foundPairs(id);
  const how = STARTERS.includes(id) ? '<div class="rec">Стартовый элемент — есть с самого начала</div>'
    : got.map(([a, b]) => `<div class="rec">${part(a)}<i>+</i>${part(b)}</div>`).join('') +
      '<div class="rec q-rec"><span class="q">???</span><i>+</i><span class="q">???</span></div>'.repeat(all.length - got.length);
  const howTitle = STARTERS.includes(id) ? 'Как получить' : `Рецепты: ${got.length} из ${all.length}`;
  modal({
    icon: iconHtml(id, d.icon, 'modal-ico'), title: d.name, cls: 'info',
    text: `<span class="chip">${eraIcon(d.era)} ${eraById[d.era].name}</span><span class="desc">${(MODE === 'classic' && INFO_CLASSIC[id]) || INFO[id] || ''}</span>` +
          `<b class="how">${howTitle}</b>${how}` +
          `<b class="how">Что из него получается</b><div class="rec">${leftLine(id)}</div>`,
    buttons: [{ text: 'Понятно', primary: true }],
  });
  haptic('light');
}

/* ============ ИСЧЕРПАННЫЕ ЭЛЕМЕНТЫ ============ */
// элемент «исчерпан», если всё, что из него можно получить, уже открыто
const newFrom = (id) => [...new Set((M.uses[id] || []).filter(r => !discovered.has(r)))];
const isDone = (id) => newFrom(id).length === 0;
function leftLine(id) {
  const n = newFrom(id).length;
  return n ? `Ещё может дать новых элементов: <b>${n}</b>` : 'Все сочетания с ним уже найдены ✓';
}
function refreshDone() { board.querySelectorAll('.el').forEach(el => el.classList.toggle('done', isDone(el.dataset.id))); }

/* ============ РЕЖИМЫ ============ */
const START_EXAMPLE = { classic: ['fire', 'water'], cosmos: ['energy', 'energy'] };
function chooseMode(first) {
  const cards = Object.keys(MODES).map(id => {
    const m = MODES[id];
    return `<button class="mode-card${id === MODE && !first ? ' on' : ''}" data-mode="${id}">${iconHtml(m.icon, '', 'mode-ico')}` +
      `<b>${m.name}</b><small>${m.short}</small><span>${m.desc}</span><em>Открыто: ${progress[id].size} / ${MODE_SIZE[id]}</em></button>`;
  }).join('');
  modal({
    icon: iconHtml('logo', '', 'modal-ico'), title: first ? 'Выбери режим' : 'Режим игры',
    text: `${first ? 'Режим можно сменить в любой момент — нажми на название вверху. Прогресс у режимов свой.' : 'Прогресс каждого режима сохраняется отдельно.'}<span class="modes">${cards}</span>`,
    buttons: first ? [] : [{ text: 'Отмена' }],
  });
  document.querySelectorAll('.mode-card').forEach(b => b.onclick = () => {
    modalEl.classList.remove('open'); switchMode(b.dataset.mode);
  });
}
function switchMode(id) {
  if (id !== MODE) {
    useMode(id); discovered = progress[id];
    board.querySelectorAll('.el').forEach(e => e.remove()); placeStarters();
    updateCounter(); toast(`Режим «${M.name}»`); haptic('medium');
  }
  document.getElementById('modeName').textContent = M.name;
  save();
  if (!tutDone) setTimeout(() => tutorial(0), 300);
}
document.getElementById('btnMode').onclick = () => chooseMode(false);

/* ============ ОБУЧЕНИЕ ============ */
function tutorial(step) {
  const [a, b] = START_EXAMPLE[MODE];
  const res = recipes[key(a, b)];
  const steps = [
    { icon: iconHtml(res, '', 'modal-ico'), title: 'Соединяй элементы',
      text: `Перетащи один элемент на другой. Например: <b>${label(a)}</b> + <b>${label(b)}</b> = <b>${label(res)}</b>.` },
    { icon: iconHtml('ui_list', '', 'modal-ico'), title: 'Полезные жесты',
      text: '<b>Двойной тап</b> по элементу — его копия.<br><b>Двойной тап по пустому месту</b> — снова стартовые элементы.<br>Перетащи элемент на <b>Корзину</b>, чтобы убрать его.' },
    { icon: iconHtml('ui_hint', '', 'modal-ico'), title: 'Если застрял',
      text: '<b>Список</b> — все элементы по эпохам.<br><b>Подсказка</b> — раз в 5 минут.<br><b>?</b> вверху — справка об элементе.<br>Потускневший элемент уже отдал все свои рецепты.' },
  ];
  const st = steps[step];
  modal({ ...st, text: `${st.text}<br><br><span style="opacity:.6">${step + 1} / ${steps.length}</span>`,
    buttons: step < steps.length - 1
      ? [{ text: 'Пропустить', onClick: () => { tutDone = true; save(); } }, { text: 'Дальше', primary: true, onClick: () => tutorial(step + 1) }]
      : [{ text: 'Играть!', primary: true, onClick: () => { tutDone = true; save(); } }] });
}

/* ============ ОЧИСТКА / КОРЗИНА ============ */
document.getElementById('btnClear').onclick = () => {
  board.querySelectorAll('.el').forEach(e => e.remove()); checkEmpty(); haptic('medium'); Sound.play('clear');
};
trashBtn.onclick = () => toast('Перетащи элемент на корзину, чтобы убрать его');

/* ============ ПОБЕДА ============ */
function showWin() {
  tickTime(); save();
  const st = stats[MODE];
  document.getElementById('winText').textContent =
    discovered.size >= modeEls.length ? `Режим «${M.name}»: открыты все ${modeEls.length} элементов. Полная коллекция!`
    : `Режим «${M.name}»: открыто ${discovered.size} из ${modeEls.length} элементов. Можно продолжить и найти остальные!`;
  document.getElementById('winStats').innerHTML =
    `<div><b>${fmtDur(st.t)}</b><span>в игре</span></div><div><b>${st.s}</b><span>попыток</span></div><div><b>${st.h}</b><span>подсказок</span></div>`;
  document.getElementById('winUnlock').innerHTML = allGoals()
    ? '★ Награда «Творец»: оба режима пройдены! Открыта тема «Сияние» и золотая колба'
    : '★ Награда «Создатель Вселенной». Открыта тема «Туманность» — выбери её в окне статистики';
  applyTheme();
  document.getElementById('win').classList.add('open'); Sound.play('win');
}
document.getElementById('btnWin').onclick = () => document.getElementById('win').classList.remove('open');
document.getElementById('btnShare').onclick = shareResult;

/* ============ СТАРТ ============ */
document.getElementById('logo').innerHTML = iconHtml('logo', '✨', 'logo');
// иконки интерфейса
document.querySelectorAll('[data-ui]').forEach(el => el.innerHTML = iconHtml(el.dataset.ui, '', 'ui'));
/* ============ СТАТИСТИКА ============ */
// время считаем, только пока игра на экране и игрок что-то делал в последние 2 минуты
const IDLE_LIMIT = 2 * 60 * 1000;
let tickAt = Date.now(), lastActive = Date.now(), unsavedTime = 0;
['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, () => { lastActive = Date.now(); }, true));
function tickTime() {
  const now = Date.now(), dt = now - tickAt; tickAt = now;
  if (!MODE || document.hidden || dt > 5000 || now - lastActive > IDLE_LIMIT) return;
  stats[MODE].t += dt; unsavedTime += dt;
  if (unsavedTime >= 30000) { unsavedTime = 0; save(); }          // время и попытки — раз в 30 с
}
setInterval(tickTime, 1000);
document.addEventListener('visibilitychange', () => { tickTime(); if (document.hidden && statsDirty) save(); });

function fmtDur(ms, withSec) {
  const s = Math.round(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  if (h) return `${h} ч ${m} мин`;
  if (m) return withSec && sec ? `${m} мин ${sec} с` : `${m} мин`;
  return withSec ? `${sec} с` : 'меньше минуты';
}
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
function showStats() {
  tickTime();
  const st = stats[MODE], total = modeEls.length, rec = Object.keys(recipes).length, fc = foundCount();
  const tile = (value, label, wide) => `<div class="stat${wide ? ' wide' : ''}"><b>${value}</b><span>${label}</span></div>`;
  const tiles = [
    tile(`${discovered.size} <small>/ ${total} · ${pct(discovered.size, total)}%</small>`, 'Открыто элементов'),
    tile(`${fc} <small>/ ${rec} · ${pct(fc, rec)}%</small>`, 'Найдено рецептов'),
    tile(st.s, 'Попыток соединить'),
    tile(`${st.ok} <small>· ${pct(st.ok, st.s)}%</small>`, 'Из них удачных'),
    tile(fmtDur(st.t), 'Время в игре'),
    tile(st.n ? fmtDur(st.t / st.n, true) : '—', 'В среднем на новый элемент'),
    tile(st.h, 'Подсказок взято', true),
  ].join('');
  modal({
    icon: iconHtml('ui_stats', '📊', 'modal-ico'), title: `Статистика и награды · ${M.name}`,
    text: `<span class="stats-grid">${tiles}</span>` +
          `<span class="stats-note">У каждого режима своя статистика. Время идёт, только пока ты играешь.</span>` + awardsHtml(),
    buttons: [{ text: 'Понятно', primary: true }], cls: 'info',
  });
  bindThemeButtons();
  haptic('light');
}
document.getElementById('counter').onclick = showStats;

/* ============ НАГРАДЫ ============ */
// Медали эпох и особые награды не хранятся отдельно — они вычисляются из прогресса.
const BOT_LINK = 'https://t.me/alchemia_universumbot';   // ссылка на бота — для кнопки «Поделиться»
const eraComplete = (mode, era, B) => { const els = ELEMENTS.filter(e => e[3] === era && B.set.has(e[0]));
  return els.length > 0 && els.every(e => progress[mode].has(e[0])); };
const goalDone = (m) => progress[m].has(MODES[m].goal);
const fullDone = (m) => m === MODE && discovered.size >= modeEls.length;
const anyGoal = () => Object.keys(MODES).some(goalDone);
const allGoals = () => Object.keys(MODES).every(goalDone);
const THEMES = [
  { id: 'night', name: 'Ночь', bg: 'linear-gradient(135deg,#1b1446,#0b1026)', ok: () => true },
  { id: 'nebula', name: 'Туманность', bg: 'linear-gradient(135deg,#4a1d44,#1a0b1e)', ok: anyGoal },
  { id: 'aurora', name: 'Сияние', bg: 'linear-gradient(135deg,#0e3f45,#041619)', ok: allGoals },
];
function applyTheme() {
  const t = THEMES.find(x => x.id === theme && x.ok()) || THEMES[0];
  document.body.classList.remove(...THEMES.map(x => 'theme-' + x.id));
  if (t.id !== 'night') document.body.classList.add('theme-' + t.id);
  document.body.classList.toggle('creator', allGoals());
  const bg = getComputedStyle(document.body).getPropertyValue('--bg1').trim() || '#0b1026';
  try { tg && tg.setHeaderColor && tg.setHeaderColor(bg); tg && tg.setBackgroundColor && tg.setBackgroundColor(bg);
    tg && tg.setBottomBarColor && tg.isVersionAtLeast('7.10') && tg.setBottomBarColor(bg); } catch (e) {}
}
function awardsHtml() {
  const eras = ERAS.filter(([e]) => modeEls.some(x => x[3] === e));
  const medals = eras.map(([e, name]) => `<span class="medal${eraComplete(MODE, e, M) ? '' : ' off'}"><i>${eraIcon(e, '')}</i>${name}</span>`).join('');
  const got = eras.filter(([e]) => eraComplete(MODE, e, M)).length;
  // неполученные награды — тайна: силуэт и «???»
  const feat = (ok, icon, title, text) => ok
    ? `<div class="feat got">${iconHtml(icon, '', '')}<div><b>${title}</b><span>${text}</span></div></div>`
    : `<div class="feat off"><span class="feat-ico">${iconHtml(icon, '', '')}</span><div><b>???</b><span>Секретная награда</span></div></div>`;
  const feats = [
    feat(goalDone(MODE), 'universe', 'Создатель Вселенной', `Найти Вселенную в режиме «${M.name}» · тема «Туманность»`),
    feat(fullDone(MODE), 'ui_trophy', 'Полная коллекция', `Открыть все ${modeEls.length} элементов режима`),
    feat(allGoals(), 'logo', 'Творец', 'Создать Вселенную в обоих режимах · тема «Сияние» и золотая колба'),
  ].join('');
  const themes = THEMES.map(t => `<button class="theme-btn${t.id === theme ? ' on' : ''}${t.ok() ? '' : ' locked'}" data-theme="${t.id}" style="background:${t.bg}">${t.ok() ? t.name : iconHtml('ui_lock', '🔒', 'mini') + ' ' + t.name}</button>`).join('');
  return `<b class="awards-title">Медали эпох · ${got} / ${eras.length}</b><span class="medals">${medals}</span>` +
         `<b class="awards-title">Награды</b><span class="feats">${feats}</span>` +
         `<b class="awards-title">Тема оформления</b><span class="themes">${themes}</span>`;
}
function bindThemeButtons() {
  document.querySelectorAll('.theme-btn').forEach(b => b.onclick = () => {
    const t = THEMES.find(x => x.id === b.dataset.theme);
    if (!t.ok()) { toast(`Тема «${t.name}» откроется вместе с секретной наградой`); return; }
    theme = t.id; applyTheme(); save(); haptic('light');
    document.querySelectorAll('.theme-btn').forEach(x => x.classList.toggle('on', x === b));
  });
}
// после открытия элемента: медаль эпохи или полная коллекция
function checkAwards(era) {
  if (fullDone(MODE)) {
    setTimeout(() => { Sound.play('era'); modal({ icon: iconHtml('ui_trophy', '🏆', 'modal-ico'), title: 'Полная коллекция!',
      text: `Ты открыл все ${modeEls.length} элементов режима «${M.name}». Невероятно!`, buttons: [{ text: 'Ура!', primary: true }] }); }, 900);
  } else if (eraComplete(MODE, era, M)) {
    setTimeout(() => { Sound.play('era'); toast(`Медаль эпохи <b>${eraIcon(era)} ${eraById[era].name}</b><br>Все элементы эпохи открыты!`, 'era'); }, 1400);
  }
}
function shareResult() {
  const st = stats[MODE];
  const text = `Я создал Вселенную в «Алхимии» (режим «${M.name}»)` + (st.t ? ` за ${fmtDur(st.t)}` : '') + '! Попробуй и ты 🌌';
  if (BOT_LINK && tg && tg.openTelegramLink) {
    tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(BOT_LINK)}&text=${encodeURIComponent(text)}`);
  } else {
    const full = text + (BOT_LINK ? ' ' + BOT_LINK : '');
    const manual = () => modal({ icon: iconHtml('universe', '', 'modal-ico'), title: 'Поделиться', text: `Скопируй и отправь друзьям:<br><b style="user-select:text;-webkit-user-select:text">${full}</b>`, buttons: [{ text: 'Готово', primary: true }] });
    try { navigator.clipboard.writeText(full).then(() => toast('Текст скопирован — отправь его друзьям'), manual); }
    catch (e) { manual(); }
  }
}

document.getElementById('winIcon').innerHTML = iconHtml('universe', '🌌', 'win-ico');
load();
// режим: сохранённый; старые игроки (прогресс в «Космосе») — сразу в «Космос»; новые — выбирают
const startMode = savedMode || (progress.cosmos.size > 4 ? 'cosmos' : null);
useMode(startMode || 'classic'); discovered = progress[MODE];
fillMissingPairs();
applyTheme();
document.getElementById('modeName').textContent = M.name;
updateCounter(); updateHintBtn();
requestAnimationFrame(placeStarters);
if (!startMode) setTimeout(() => chooseMode(true), 400);
else if (!tutDone) setTimeout(() => tutorial(0), 400);
// игрокам из прошлой версии — один раз рассказать о новом режиме
else if (!savedMode) { save(); setTimeout(() => toast('Новое: режим «Классика» от четырёх стихий — нажми на название вверху'), 900); }
</script>
</body>
</html>
