<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Алхимия Вселенной</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg1: #0b1026; --bg2: #1b1446;
    --panel: rgba(20, 22, 48, .94);
    --text: #eef0ff; --muted: #9aa0c8;
    --accent: #8b7bff; --danger: #ff5c7a; --gold: #ffd166;
    --tile: rgba(255,255,255,.07); --tile-border: rgba(255,255,255,.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at 30% 20%, var(--bg2), var(--bg1) 70%);
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); font-size: 15px;
  }
  header .title { font-weight: 700; letter-spacing: .3px; }
  #counter { color: var(--muted); font-variant-numeric: tabular-nums; }
  #progress { height: 3px; background: rgba(255,255,255,.08); margin: 0 16px; border-radius: 2px; overflow: hidden; }
  #progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #ff8bd1); transition: width .4s; }

  /* поле поверх шапки и кнопок: перетаскиваемый элемент не прячется за панелью */
  #board { position: relative; flex: 1; z-index: 5; }
  header, #progress, footer { position: relative; z-index: 1; }
  #board::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff, transparent),
      radial-gradient(1px 1px at 72% 34%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 40% 80%, #fff, transparent),
      radial-gradient(1px 1px at 88% 72%, #fff, transparent),
      radial-gradient(1px 1px at 25% 55%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 60% 12%, #fff, transparent);
  }
  #hint {
    position: absolute; left: 0; right: 0; bottom: 14px; text-align: center;
    color: var(--muted); font-size: 13px; pointer-events: none; padding: 0 16px; line-height: 1.4;
  }

  .el {
    position: absolute; width: 76px; display: flex; flex-direction: column; align-items: center;
    cursor: grab; touch-action: none; transition: transform .12s;
  }
  .el .ico {
    width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center;
    font-size: 32px; background: var(--tile); border: 1px solid var(--tile-border);
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  .el .name { margin-top: 4px; font-size: 11.5px; text-align: center; line-height: 1.15; text-shadow: 0 1px 3px #000; }
  .el.dragging { z-index: 1000; cursor: grabbing; transform: scale(1.12); transition: none; }
  .el.target .ico { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,123,255,.45), 0 0 24px rgba(139,123,255,.6); }
  .el.over-trash .ico { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255,92,122,.5); }
  .el.pop { animation: pop .45s ease-out; }
  .el.shake { animation: shake .35s; }
  @keyframes pop { 0% { transform: scale(.2); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { translate: 0; } 25% { translate: -6px; } 75% { translate: 6px; } }

  footer {
    display: flex; gap: 8px; padding: 10px 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.35));
  }
  footer button {
    flex: 1; min-width: 0; height: 54px; border-radius: 16px; border: 1px solid var(--tile-border);
    background: var(--panel); color: var(--text); font-size: 13px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    cursor: pointer; transition: background .15s, border-color .15s, transform .15s, opacity .15s;
    font-variant-numeric: tabular-nums;
  }
  footer button span.i { font-size: 20px; line-height: 1; }
  footer button:active { transform: scale(.96); }
  #btnTrash.hot { border-color: var(--danger); background: rgba(255,92,122,.25); transform: scale(1.06); }
  #btnHint.ready { border-color: var(--gold); box-shadow: 0 0 14px rgba(255,209,102,.35); }
  #btnHint.wait { opacity: .6; }

  /* ---- список ---- */
  #sheet {
    position: fixed; inset: 0; z-index: 2000; display: none;
    background: rgba(5,6,20,.6); backdrop-filter: blur(4px);
  }
  #sheet.open { display: block; }
  #sheet .box {
    position: absolute; left: 0; right: 0; bottom: 0; height: 86%;
    background: var(--panel); border-radius: 22px 22px 0 0; border-top: 1px solid var(--tile-border);
    display: flex; flex-direction: column; animation: up .22s ease-out;
    padding-bottom: env(safe-area-inset-bottom);
  }
  @keyframes up { from { transform: translateY(40%); opacity: 0; } }
  #sheet .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 8px; }
  #sheet .head b { flex: 1; font-size: 17px; }
  #sheet .head span { color: var(--muted); font-size: 13px; }
  .btn-sm {
    background: var(--tile); border: 1px solid var(--tile-border); color: var(--text);
    border-radius: 10px; padding: 7px 12px; font-size: 14px; cursor: pointer;
  }
  #search {
    margin: 0 16px 8px; padding: 10px 12px; border-radius: 12px; font-size: 15px;
    background: rgba(255,255,255,.06); border: 1px solid var(--tile-border); color: var(--text); outline: none;
    user-select: text; -webkit-user-select: text;
  }
  #search:focus { border-color: var(--accent); }
  #eras {
    display: flex; gap: 6px; padding: 0 16px 8px; overflow-x: auto; touch-action: pan-x;
    scrollbar-width: none; flex-shrink: 0;
  }
  #eras::-webkit-scrollbar { display: none; }
  #eras button {
    flex-shrink: 0; background: transparent; border: 1px solid var(--tile-border); color: var(--muted);
    border-radius: 99px; padding: 6px 11px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  #eras button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #eras button.locked { opacity: .45; }
  #grid { overflow-y: auto; padding: 4px 12px 12px; touch-action: pan-y; flex: 1; }
  .era-title {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 12px 4px 8px; font-weight: 700; font-size: 14px;
  }
  .era-title span { color: var(--muted); font-weight: 400; font-size: 12px; }
  .era-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px 6px; }
  .era-locked { color: var(--muted); font-size: 13px; padding: 4px 4px 8px; }
  .cell { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .cell .ico {
    width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-size: 29px;
    background: var(--tile); border: 1px solid var(--tile-border);
  }
  .cell .name { margin-top: 4px; font-size: 11px; text-align: center; color: var(--text); line-height: 1.15; }
  .svg-ico { width: 46px; height: 46px; display: block; filter: drop-shadow(0 0 4px currentColor); }
  .cell .svg-ico { width: 42px; height: 42px; }
  .cell.locked .svg-ico { filter: none; }
  .cell.locked { cursor: default; }
  .cell.locked .ico { background: transparent; border-style: dashed; }
  .cell.locked .ico span { filter: brightness(0) invert(1); opacity: .16; }
  .cell.locked .name { color: var(--muted); }
  .cell .recipe { font-size: 10px; color: var(--muted); margin-top: 1px; text-align: center; }
  .sheet-foot { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 12px; }
  #onlyOpen { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  #btnReset { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 14px; }

  /* ---- модальные окна ---- */
  .modal {
    position: fixed; inset: 0; z-index: 3500; display: none; place-items: center; padding: 16px;
    background: rgba(5,6,20,.7); backdrop-filter: blur(3px);
  }
  .modal.open { display: grid; }
  .modal .card {
    width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--tile-border);
    border-radius: 20px; padding: 20px; text-align: center; animation: pop .3s ease-out;
  }
  .modal .big { font-size: 46px; line-height: 1; }
  .modal h3 { margin: 10px 0 6px; font-size: 18px; }
  .modal p { margin: 0 0 16px; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .modal p b { color: var(--text); }
  .modal .row { display: flex; gap: 10px; }
  .modal .row button {
    flex: 1; border: 1px solid var(--tile-border); background: var(--tile); color: var(--text);
    border-radius: 12px; padding: 11px; font-size: 15px; cursor: pointer;
  }
  .modal .row button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  #toast {
    position: fixed; top: 64px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--panel); border: 1px solid var(--accent); border-radius: 14px;
    padding: 10px 16px; font-size: 14px; opacity: 0; pointer-events: none; z-index: 3000;
    transition: opacity .25s, transform .25s; max-width: calc(100% - 32px); text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.era { border-color: var(--gold); }

  #win {
    position: fixed; inset: 0; z-index: 4000; display: none; place-items: center; text-align: center;
    background: radial-gradient(circle, rgba(139,123,255,.35), rgba(5,6,20,.92)); padding: 16px;
  }
  #win.open { display: grid; }
  #win .big { font-size: 96px; animation: pop .8s ease-out; }
  #win h2 { margin: 10px 0 6px; }
  #win p { color: var(--muted); margin: 0 0 18px; }
  #win button { background: var(--accent); color: #fff; border: 0; border-radius: 14px; padding: 12px 22px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title">✨ Алхимия Вселенной</span>
    <span id="counter">0 / 0</span>
  </header>
  <div id="progress"><div></div></div>
  <div id="board"><div id="hint">Перетащи один элемент на другой, чтобы соединить их.<br>Двойной тап по пустому месту — стартовые элементы</div></div>
  <footer>
    <button id="btnList"><span class="i">📖</span>Список</button>
    <button id="btnHint"><span class="i">💡</span><span id="hintLabel">Подсказка</span></button>
    <button id="btnClear"><span class="i">🧹</span>Очистка</button>
    <button id="btnTrash"><span class="i">🗑️</span>Корзина</button>
  </footer>
</div>

<div id="sheet">
  <div class="box">
    <div class="head"><b>Элементы</b><span id="sheetCount"></span><button class="btn-sm" id="btnClose">✕</button></div>
    <input id="search" type="search" placeholder="🔍 Поиск по открытым" autocomplete="off">
    <div id="eras"></div>
    <div id="grid"></div>
    <div class="sheet-foot">
      <label id="onlyOpen"><input type="checkbox" id="chkOpen"> только открытые</label>
      <button class="btn-sm" id="btnReset">Сбросить прогресс</button>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="card">
    <div class="big" id="mIcon"></div>
    <h3 id="mTitle"></h3>
    <p id="mText"></p>
    <div class="row" id="mButtons"></div>
  </div>
</div>

<div id="toast"></div>
<div id="win">
  <div>
    <div class="big">🌌</div>
    <h2>Ты создал Вселенную!</h2>
    <p id="winText"></p>
    <button id="btnWin">Продолжить</button>
  </div>
</div>

<script src="elements.js"></script>
<script src="icons.js"></script>
<script>
/* ============ ДАННЫЕ ============ */
const HINT_COOLDOWN = 5 * 60 * 1000;   // подсказка раз в 5 минут

const byId = {}, recipes = {}, producers = {};
const key = (a, b) => [a, b].sort().join('+');
ELEMENTS.forEach(([id, name, icon, era], i) => byId[id] = { id, name, icon, era, order: i });
RECIPES.forEach(r => {
  const [ab, res] = r.split('='), [a, b] = ab.split('+');
  recipes[key(a, b)] = res;
  (producers[res] = producers[res] || []).push([a, b]);
});
const STARTERS = ELEMENTS.map(e => e[0]).filter(id => !producers[id]);
const eraById = Object.fromEntries(ERAS.map(([id, name, icon]) => [id, { id, name, icon }]));

/* ============ TELEGRAM ============ */
const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.initData);
const cloudOk = inTelegram && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') && !!tg.CloudStorage;
if (tg) {
  try { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes();
        tg.setHeaderColor && tg.setHeaderColor('#0b1026'); tg.setBackgroundColor && tg.setBackgroundColor('#0b1026'); } catch (e) {}
}
const haptic = (type) => { try { tg && tg.HapticFeedback && (type === 'error' || type === 'success'
  ? tg.HapticFeedback.notificationOccurred(type) : tg.HapticFeedback.impactOccurred(type)); } catch (e) {} };

/* ============ СОХРАНЕНИЕ ============ */
const SAVE_KEY = 'alchemy_universe_v2', OLD_KEY = 'alchemy_universe_v1';
let discovered = new Set(STARTERS);
let lastHint = 0;
function applySave(raw) {
  if (!raw) return;
  const s = JSON.parse(raw);
  const list = Array.isArray(s) ? s : (s.d || []);
  list.forEach(id => byId[id] && discovered.add(id));
  if (!Array.isArray(s) && s.h) lastHint = Math.max(lastHint, s.h);
}
function load() {
  try { applySave(localStorage.getItem(OLD_KEY)); } catch (e) {}
  try { applySave(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  try { cloudOk && tg.CloudStorage.getItem(SAVE_KEY, (err, v) => {
    if (!err && v) { try { applySave(v); } catch (e) {} updateCounter(); updateHintBtn(); }
  }); } catch (e) {}
}
function save() {
  const v = JSON.stringify({ d: [...discovered], h: lastHint });
  try { localStorage.setItem(SAVE_KEY, v); } catch (e) {}
  try { cloudOk && tg.CloudStorage.setItem(SAVE_KEY, v); } catch (e) {}
}

/* ============ ОБЩЕЕ UI ============ */
const board = document.getElementById('board');
const hint = document.getElementById('hint');
const trashBtn = document.getElementById('btnTrash');
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(html, cls) {
  toastEl.innerHTML = html; toastEl.className = 'show' + (cls ? ' ' + cls : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.className = '', 2200);
}
function updateCounter() {
  const total = ELEMENTS.length;
  document.getElementById('counter').textContent = `${discovered.size} / ${total}`;
  document.querySelector('#progress > div').style.width = (discovered.size / total * 100) + '%';
}
const eraOpen = (era) => ELEMENTS.some(e => e[3] === era && discovered.has(e[0]));
const label = (id) => `${byId[id].icon} ${byId[id].name}`;

/* модальное окно: modal({icon, title, text, buttons:[{text, primary, onClick}]}) */
const modalEl = document.getElementById('modal');
function modal({ icon, title, text, buttons }) {
  document.getElementById('mIcon').textContent = icon || '';
  document.getElementById('mTitle').textContent = title || '';
  document.getElementById('mText').innerHTML = text || '';
  const row = document.getElementById('mButtons'); row.innerHTML = '';
  buttons.forEach(b => {
    const el = document.createElement('button');
    el.textContent = b.text; if (b.primary) el.className = 'primary';
    el.onclick = () => { modalEl.classList.remove('open'); b.onClick && b.onClick(); };
    row.appendChild(el);
  });
  modalEl.classList.add('open');
}

/* ============ ПОЛЕ ============ */
function spawn(id, x, y, anim) {
  const d = byId[id];
  const el = document.createElement('div');
  el.className = 'el' + (anim ? ' pop' : '');
  el.dataset.id = id;
  el.innerHTML = `<div class="ico">${iconHtml(id, d.icon)}</div><div class="name">${d.name}</div>`;
  const r = board.getBoundingClientRect();
  x = Math.max(0, Math.min(r.width - 76, x)); y = Math.max(0, Math.min(r.height - 84, y));
  el.style.left = x + 'px'; el.style.top = y + 'px';
  board.appendChild(el);
  el.addEventListener('pointerdown', startDrag);
  el.addEventListener('animationend', () => el.classList.remove('pop', 'shake'));
  hint.style.display = 'none';
  return el;
}

function center(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + 29 }; }
function findTarget(drag) {
  const c = center(drag); let best = null, bd = 50;
  board.querySelectorAll('.el').forEach(o => {
    if (o === drag) return;
    const p = center(o), d = Math.hypot(p.x - c.x, p.y - c.y);
    if (d < bd) { bd = d; best = o; }
  });
  return best;
}
function overTrash(px, py) {
  const r = trashBtn.getBoundingClientRect();
  return px >= r.left - 8 && px <= r.right + 8 && py >= r.top - 20 && py <= r.bottom + 8;
}

let drag = null;
function startDrag(e) {
  const el = e.currentTarget;
  const r = el.getBoundingClientRect();
  drag = { el, dx: e.clientX - r.left, dy: e.clientY - r.top, sx: e.clientX, sy: e.clientY, moved: false, target: null };
  e.preventDefault();
  el.classList.add('dragging');
  board.appendChild(el);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
}
function onMove(e) {
  if (!drag) return;
  const br = board.getBoundingClientRect();
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 4) drag.moved = true;
  drag.el.style.left = (e.clientX - br.left - drag.dx) + 'px';
  drag.el.style.top = (e.clientY - br.top - drag.dy) + 'px';
  const hot = overTrash(e.clientX, e.clientY);
  const t = hot ? null : findTarget(drag.el);
  if (drag.target && drag.target !== t) drag.target.classList.remove('target');
  if (t) t.classList.add('target');
  drag.target = t;
  trashBtn.classList.toggle('hot', hot);
  drag.el.classList.toggle('over-trash', hot);
}
function endDrag(e) {
  if (!drag) return;
  const { el, target, moved } = drag;
  window.removeEventListener('pointermove', onMove);
  window.removeEventListener('pointerup', endDrag);
  window.removeEventListener('pointercancel', endDrag);
  el.classList.remove('dragging', 'over-trash');
  trashBtn.classList.remove('hot');
  if (target) target.classList.remove('target');
  drag = null;

  if (overTrash(e.clientX, e.clientY)) { el.remove(); haptic('light'); checkEmpty(); return; }
  if (!moved) { handleTap(el); return; }
  if (target) combine(el, target);
  else {
    const br = board.getBoundingClientRect();
    el.style.left = Math.max(0, Math.min(br.width - 76, parseFloat(el.style.left))) + 'px';
    el.style.top = Math.max(0, Math.min(br.height - 84, parseFloat(el.style.top))) + 'px';
  }
}

/* двойной тап по элементу — копия */
let lastTap = { el: null, t: 0 };
function handleTap(el) {
  const now = Date.now();
  if (lastTap.el === el && now - lastTap.t < 350) {
    spawn(el.dataset.id, parseFloat(el.style.left) + 30, parseFloat(el.style.top) + 30, true);
    haptic('light'); lastTap = { el: null, t: 0 };
  } else lastTap = { el, t: now };
}

/* двойной тап по пустому месту — стартовые элементы */
let lastBoardTap = { t: 0, x: 0, y: 0 };
board.addEventListener('pointerdown', e => {
  if (e.target !== board) return;
  const now = Date.now();
  if (now - lastBoardTap.t < 350 && Math.hypot(e.clientX - lastBoardTap.x, e.clientY - lastBoardTap.y) < 40) {
    const r = board.getBoundingClientRect();
    const x = e.clientX - r.left - 38, y = e.clientY - r.top - 42, o = 48;
    [[-o, -o], [o, -o], [-o, o], [o, o]].forEach(([dx, dy], i) => STARTERS[i] && spawn(STARTERS[i], x + dx, y + dy, true));
    haptic('light'); lastBoardTap = { t: 0, x: 0, y: 0 };
  } else lastBoardTap = { t: now, x: e.clientX, y: e.clientY };
});

function combine(a, b) {
  const result = recipes[key(a.dataset.id, b.dataset.id)];
  if (!result) {
    a.classList.add('shake'); b.classList.add('shake'); haptic('error');
    a.style.left = (parseFloat(a.style.left) + 40) + 'px';
    return;
  }
  const x = (parseFloat(a.style.left) + parseFloat(b.style.left)) / 2;
  const y = (parseFloat(a.style.top) + parseFloat(b.style.top)) / 2;
  a.remove(); b.remove();
  spawn(result, x, y, true);
  if (!discovered.has(result)) discover(result);
  else haptic('medium');
}

function discover(id) {
  const era = byId[id].era, newEra = !eraOpen(era);
  discovered.add(id); save(); updateCounter(); haptic('success');
  if (newEra) toast(`Открыта эпоха: <b>${eraById[era].icon} ${eraById[era].name}</b><br>${label(id)}`, 'era');
  else toast(`Новый элемент: <b>${label(id)}</b>`);
  if (id === GOAL) setTimeout(showWin, 700);
}

function checkEmpty() { if (!board.querySelector('.el')) hint.style.display = ''; }

function placeStarters() {
  const r = board.getBoundingClientRect();
  const cx = r.width / 2 - 38, cy = r.height / 2 - 42, off = Math.min(90, r.width / 5);
  [[-off, -off], [off, -off], [-off, off], [off, off]].forEach(([dx, dy], i) => STARTERS[i] && spawn(STARTERS[i], cx + dx, cy + dy, true));
}

/* ============ СПИСОК ============ */
const sheet = document.getElementById('sheet');
const grid = document.getElementById('grid');
const searchEl = document.getElementById('search');
const chkOpen = document.getElementById('chkOpen');
let eraFilter = 'all';

function knownRecipe(id) {
  const list = producers[id] || [];
  const r = list.find(([a, b]) => discovered.has(a) && discovered.has(b)) || list[0];
  return r ? `${byId[r[0]].icon} + ${byId[r[1]].icon}` : '';
}
function cellHtml(id) {
  const d = byId[id], open = discovered.has(id);
  const recipe = open && producers[id] ? `<div class="recipe">${knownRecipe(id)}</div>` : '';
  return `<div class="cell${open ? '' : ' locked'}" data-id="${id}"><div class="ico"><span>${iconHtml(id, d.icon)}</span></div>` +
         `<div class="name">${open ? d.name : '???'}</div>${recipe}</div>`;
}
function renderEras() {
  const box = document.getElementById('eras');
  const btn = (id, text, locked) =>
    `<button data-era="${id}" class="${eraFilter === id ? 'on' : ''}${locked ? ' locked' : ''}">${text}</button>`;
  box.innerHTML = btn('all', 'Все') + ERAS.map(([id, name, icon]) => {
    const all = ELEMENTS.filter(e => e[3] === id), got = all.filter(e => discovered.has(e[0])).length;
    return got ? btn(id, `${icon} ${name} ${got}/${all.length}`) : btn(id, `🔒 ${name}`, true);
  }).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = () => { eraFilter = b.dataset.era; renderList(); });
}
function renderList() {
  renderEras();
  document.getElementById('sheetCount').textContent = `${discovered.size} / ${ELEMENTS.length}`;
  const q = searchEl.value.trim().toLowerCase();
  const onlyOpen = chkOpen.checked || q;
  let html = '';
  ERAS.forEach(([era, name, icon]) => {
    if (eraFilter !== 'all' && eraFilter !== era) return;
    const all = ELEMENTS.filter(e => e[3] === era).map(e => e[0]);
    const got = all.filter(id => discovered.has(id)).length;
    let ids = all;
    if (onlyOpen) ids = ids.filter(id => discovered.has(id));
    if (q) ids = ids.filter(id => byId[id].name.toLowerCase().includes(q));
    if (!got && !q) {
      if (eraFilter === era || !onlyOpen)
        html += `<div class="era-title">🔒 ${name}<span>0 / ${all.length}</span></div>` +
                `<div class="era-locked">Эпоха откроется, когда найдёшь её первый элемент.</div>`;
      return;
    }
    if (!ids.length) return;
    html += `<div class="era-title">${icon} ${name}<span>${got} / ${all.length}</span></div>` +
            `<div class="era-grid">${ids.map(cellHtml).join('')}</div>`;
  });
  grid.innerHTML = html || '<div class="empty">Ничего не найдено</div>';
}
grid.addEventListener('click', e => {
  const c = e.target.closest('.cell'); if (!c || c.classList.contains('locked')) return;
  const r = board.getBoundingClientRect();
  spawn(c.dataset.id, r.width / 2 - 38 + (Math.random() - .5) * 80, r.height / 2 - 42 + (Math.random() - .5) * 80, true);
  closeList(); haptic('light');
});
function openList() { searchEl.value = ''; renderList(); sheet.classList.add('open'); grid.scrollTop = 0; }
function closeList() { sheet.classList.remove('open'); searchEl.blur(); }
document.getElementById('btnList').onclick = openList;
document.getElementById('btnClose').onclick = closeList;
sheet.addEventListener('click', e => { if (e.target === sheet) closeList(); });
searchEl.addEventListener('input', renderList);
chkOpen.addEventListener('change', renderList);
document.getElementById('btnReset').onclick = () => modal({
  icon: '⚠️', title: 'Сбросить прогресс?', text: 'Все открытые элементы будут потеряны.',
  buttons: [
    { text: 'Отмена' },
    { text: 'Сбросить', primary: true, onClick: () => {
      discovered = new Set(STARTERS); lastHint = 0; save(); updateCounter(); updateHintBtn();
      board.querySelectorAll('.el').forEach(e => e.remove()); placeStarters(); closeList();
    } },
  ],
});

/* ============ ПОДСКАЗКИ ============ */
const hintBtn = document.getElementById('btnHint');
const hintLabel = document.getElementById('hintLabel');
const hintLeft = () => Math.max(0, lastHint + HINT_COOLDOWN - Date.now());
const fmt = (ms) => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function updateHintBtn() {
  const left = hintLeft();
  hintLabel.textContent = left ? fmt(left) : 'Подсказка';
  hintBtn.classList.toggle('ready', !left);
  hintBtn.classList.toggle('wait', !!left);
}
setInterval(updateHintBtn, 1000);

/* рецепты, которые игрок уже может собрать, но результат ещё не открыт */
function hintCandidates() {
  const out = [];
  for (const [res, list] of Object.entries(producers)) {
    if (discovered.has(res)) continue;
    for (const [a, b] of list) if (discovered.has(a) && discovered.has(b)) out.push({ res, a, b });
  }
  return out;
}
hintBtn.onclick = () => {
  const left = hintLeft();
  if (left) { toast(`Следующая подсказка через <b>${fmt(left)}</b>`); return; }
  modal({
    icon: '💡', title: 'Получить подсказку?',
    text: 'Подскажу один ингредиент для нового элемента.<br>Следующая подсказка будет доступна через 5 минут.',
    buttons: [{ text: 'Не сейчас' }, { text: 'Получить', primary: true, onClick: giveHint }],
  });
};
function giveHint() {
  const list = hintCandidates();
  if (!list.length) {
    modal({ icon: '🏆', title: 'Подсказок нет', text: 'Ты открыл всё, что можно собрать!', buttons: [{ text: 'Ок', primary: true }] });
    return;
  }
  const h = list[Math.floor(Math.random() * list.length)];
  const [x] = Math.random() < .5 ? [h.a, h.b] : [h.b, h.a];
  lastHint = Date.now(); save(); updateHintBtn();
  modal({
    icon: byId[x].icon, title: 'Подсказка',
    text: `Возьми <b>${label(x)}</b> и найди ему пару среди открытых элементов.<br>Получится новый элемент из эпохи «${eraById[byId[h.res].era].name}».`,
    buttons: [{ text: 'Понятно', primary: true }],
  });
  haptic('light');
}

/* ============ ОЧИСТКА / КОРЗИНА ============ */
document.getElementById('btnClear').onclick = () => {
  board.querySelectorAll('.el').forEach(e => e.remove()); checkEmpty(); haptic('medium');
};
trashBtn.onclick = () => toast('Перетащи элемент на корзину, чтобы убрать его');

/* ============ ПОБЕДА ============ */
function showWin() {
  document.getElementById('winText').textContent =
    `Открыто ${discovered.size} из ${ELEMENTS.length} элементов. Можно продолжить и найти остальные!`;
  document.getElementById('win').classList.add('open');
}
document.getElementById('btnWin').onclick = () => document.getElementById('win').classList.remove('open');

/* ============ СТАРТ ============ */
load(); updateCounter(); updateHintBtn();
requestAnimationFrame(placeStarters);
</script>
</body>
</html>
